services:
  - type: web
    name: phishshield-fullstack
    runtime: node
    branch: fullstack
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: phishshield-db
          property: connectionString

databases:
  - name: phishshield-db
    databaseName: phishshield
    user: phishshield
    plan: free
