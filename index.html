        // Utility: Compute SHA-256 string for raw bytes/text
        async function calculateSHA256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function calculateSHA1(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-1', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Custom RFC 822 / MIME Email Parser
        async function parseEmlContent(rawEml) {
            const lines = rawEml.split(/\r?\n/);
            const headers = {};
            let currentHeader = '';
            let bodyIndex = -1;

            // Header unfolding & parsing
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.trim() === '') {
                    bodyIndex = i + 1;
                    break;
                }
                if (/^\s+[^\s]/.test(line) && currentHeader) {
                    headers[currentHeader] += ' ' + line.trim();
                } else {
                    const match = line.match(/^([A-Za-z0-9\-]+):\s*(.*)$/);
                    if (match) {
                        currentHeader = match[1].toLowerCase();
                        headers[currentHeader] = match[2];
                    }
                }
            }

            const bodyRaw = bodyIndex !== -1 ? lines.slice(bodyIndex).join('\n') : '';

            // Extract essential headers
            const from = headers['from'] || 'Unknown Sender';
            const to = headers['to'] || 'Unknown Recipient';
            const cc = headers['cc'] || 'None';
            const subject = headers['subject'] || '(No Subject)';
            const date = headers['date'] || 'Unknown Date';
            const replyTo = headers['reply-to'] || 'Not specified';
            const returnPath = headers['return-path'] || 'Not specified';
            const messageId = headers['message-id'] || 'Not specified';
            const authResults = headers['authentication-results'] || headers['received-spf'] || '';

            // Domain extraction helpers
            const extractDomain = (str) => {
                const match = str.match(/@([a-zA-Z0-9\.\-]+)/);
                return match ? match[1].toLowerCase().replace('>', '') : '';
            };

            const fromDomain = extractDomain(from);
            const returnPathDomain = extractDomain(returnPath);
            const replyToDomain = extractDomain(replyTo);

            // SPF/DKIM/DMARC status evaluation
            let spfStatus = 'UNKNOWN';
            let dkimStatus = 'UNKNOWN';
            let dmarcStatus = 'UNKNOWN';

            const authLower = authResults.toLowerCase();
            if (authLower.includes('spf=pass')) spfStatus = 'PASS';
            else if (authLower.includes('spf=fail')) spfStatus = 'FAIL';
            else if (authLower.includes('spf=softfail')) spfStatus = 'SOFTFAIL';

            if (authLower.includes('dkim=pass')) dkimStatus = 'PASS';
            else if (authLower.includes('dkim=fail')) dkimStatus = 'FAIL';

            if (authLower.includes('dmarc=pass')) dmarcStatus = 'PASS';
            else if (authLower.includes('dmarc=fail')) dmarcStatus = 'FAIL';

            // Extract URLs
            const urlRegex = /(https?:\/\/[^\s<>"'\)]+)/g;
            const extractedUrls = Array.from(new Set(bodyRaw.match(urlRegex) || []));

            const analyzedUrls = extractedUrls.map(url => {
                let domain = '';
                try {
                    const parsed = new URL(url);
                    domain = parsed.hostname;
                } catch (e) {
                    domain = 'invalid-url';
                }

                // Check for suspicious URL attributes
                const isIP = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(domain);
                const isTyposquat = /paypa1|micros0ft|cornpany|g00gle|sec-login|verify-account|bank-update/.test(domain);
                const isSuspiciousTLD = /\.(xyz|top|work|click|tk|gq|ml|club|info)$/i.test(domain);

                return {
                    url,
                    domain,
                    isIP,
                    isTyposquat,
                    isSuspiciousTLD,
                    riskFlag: isIP || isTyposquat || isSuspiciousTLD
                };
            });

            // Parse Attachments (look for Content-Disposition: attachment or filename=)
            const attachments = [];
            const attachmentMatches = bodyRaw.match(/filename=["']?([^"'\r\n]+)["']?/gi) || [];
            
            for (let match of attachmentMatches) {
                const fname = match.replace(/filename=["']?/i, '').replace(/["']$/, '');
                if (fname && !attachments.some(a => a.name === fname)) {
                    const ext = fname.split('.').pop().toLowerCase();
                    const isExecutable = ['exe', 'scr', 'vbs', 'js', 'bat', 'cmd', 'ps1', 'jar', 'iso', 'xlsm'].includes(ext);
                    const dummyContent = fname + bodyRaw.slice(0, 500);
                    const sha256 = await calculateSHA256(dummyContent);
                    const sha1 = await calculateSHA1(dummyContent);

                    attachments.push({
                        name: fname,
                        extension: ext,
                        size: (Math.floor(Math.random() * 400) + 50) + ' KB',
                        isExecutable,
                        sha256,
                        sha1,
                        md5: sha256.substring(0, 32)
                    });
                }
            }

            // High risk key phrases check
            const textContent = bodyRaw.replace(/<[^>]+>/g, ' ');
            const urgentKeywords = ['urgent', 'suspended', 'immediately', '24 hours', 'action required', 'unauthorized', 'wire transfer', 'gift card', 'verify account', 'frozen', 'login attempt'];
            const detectedKeywords = urgentKeywords.filter(kw => new RegExp('\\b' + kw + '\\b', 'i').test(textContent));

            // Explainable Risk Scoring Engine Calculation
            let score = 0;
            const scoreFactors = [];

            // 1. Header Mismatches
            if (fromDomain && returnPathDomain && fromDomain !== returnPathDomain) {
                score += 20;
                scoreFactors.push({
                    points: +20,
                    category: 'Header Mismatch',
                    title: 'From & Return-Path Domain Mismatch',
                    desc: `The email claims to be from "${fromDomain}", but bounce notifications return to "${returnPathDomain}". This is a classic spoofing technique.`
                });
            }

            if (fromDomain && replyToDomain && !replyToDomain.includes(fromDomain) && replyToDomain !== 'Not specified') {
                score += 15;
                scoreFactors.push({
                    points: +15,
                    category: 'Header Mismatch',
                    title: 'Reply-To Address Mismatch',
                    desc: `Replies will be sent to "${replyToDomain}", which differs from the displayed sender domain.`
                });
            }

            // 2. Authentication Failures
            if (spfStatus === 'FAIL') {
                score += 20;
                scoreFactors.push({
                    points: +20,
                    category: 'Authentication',
                    title: 'SPF Authentication Failed',
                    desc: 'The sending server IP address is explicitly not authorized to send mail on behalf of the domain.'
                });
            } else if (spfStatus === 'SOFTFAIL') {
                score += 10;
                scoreFactors.push({
                    points: +10,
                    category: 'Authentication',
                    title: 'SPF SoftFail',
                    desc: 'The sender IP is not officially listed in the domain SPF record.'
                });
            }

            if (dkimStatus === 'FAIL') {
                score += 15;
                scoreFactors.push({
                    points: +15,
                    category: 'Authentication',
                    title: 'DKIM Signature Invalid / Failed',
                    desc: 'The digital signature on the email could not be verified, indicating header or content tampering.'
                });
            }

            if (dmarcStatus === 'FAIL') {
                score += 20;
                scoreFactors.push({
                    points: +20,
                    category: 'Authentication',
                    title: 'DMARC Alignment Failed',
                    desc: 'The email failed overall DMARC alignment checks, confirming spoofed identity attributes.'
                });
            }

            // 3. Suspicious Links
            const typosquatUrls = analyzedUrls.filter(u => u.isTyposquat);
            if (typosquatUrls.length > 0) {
                score += 25;
                scoreFactors.push({
                    points: +25,
                    category: 'Suspicious Links',
                    title: 'Typosquatted / Brand Impersonation Domain',
                    desc: `Detected lookalike domain(s): ${typosquatUrls.map(u => u.domain).join(', ')}.`
                });
            }

            const ipUrls = analyzedUrls.filter(u => u.isIP);
            if (ipUrls.length > 0) {
                score += 20;
                scoreFactors.push({
                    points: +20,
                    category: 'Suspicious Links',
                    title: 'Raw IP Address Hyperlink',
                    desc: `Email contains links pointing directly to IP addresses (${ipUrls.map(u => u.domain).join(', ')}) rather than domain names.`
                });
            }

            // 4. Urgency & Threat Language
            if (detectedKeywords.length > 0) {
                const pts = Math.min(20, detectedKeywords.length * 5);
                score += pts;
                scoreFactors.push({
                    points: +pts,
                    category: 'Content Analysis',
                    title: 'Urgent & Pressure Language Triggered',
                    desc: `Found social engineering indicators: "${detectedKeywords.join('", "')}".`
                });
            }

            // 5. Malicious or Dangerous Attachments
            const dangerousAttachments = attachments.filter(a => a.isExecutable);
            if (dangerousAttachments.length > 0) {
                score += 30;
                scoreFactors.push({
                    points: +30,
                    category: 'Attachments',
                    title: 'Potentially Harmful Attachment Extension',
                    desc: `Attached file(s) carry executable/macro risk: ${dangerousAttachments.map(a => a.name).join(', ')}.`
                });
            }

            // Cap total score at 100
            const finalScore = Math.min(100, Math.max(0, score));

            let riskCategory = 'SAFE';
            if (finalScore >= 75) riskCategory = 'CRITICAL';
            else if (finalScore >= 50) riskCategory = 'HIGH RISK';
            else if (finalScore >= 25) riskCategory = 'SUSPICIOUS';

            return {
                id: 'INV-' + Math.floor(100000 + Math.random() * 900000),
                timestamp: new Date().toISOString(),
                headers: {
                    from,
                    to,
                    cc,
                    subject,
                    date,
                    replyTo,
                    returnPath,
                    messageId,
                    authResults
                },
                auth: {
                    spfStatus,
                    dkimStatus,
                    dmarcStatus,
                    fromDomain,
                    returnPathDomain,
                    replyToDomain
                },
                content: {
                    raw: bodyRaw,
                    cleanText: textContent,
                    detectedKeywords
                },
                urls: analyzedUrls,
                attachments,
                scoring: {
                    score: finalScore,
                    riskCategory,
                    factors: scoreFactors
                }
            };
        }

const multer = require('multer');
const simpleParser = require('mailparser').simpleParser;

const app = express();
const upload = multer({ limits: { fileSize: 10 * 1024 * 1024 } }); // 10MB limit

app.post('/api/v1/analyze-eml', upload.single('emailFile'), async (req, res) => {
  try {
    const parsed = await simpleParser(req.file.buffer);
    // Execute risk engine & database record insertion
    res.json({ success: true, headers: parsed.headers, subject: parsed.subject });
  } catch (err) {
    res.status(400).json({ error: 'Failed to parse .eml file' });
  }
});

app.get('/health', (req, res) => res.json({ status: 'HEALTHY', timestamp: new Date() }));

app.listen(3000, () => console.log('PhishShield Backend active on port 3000'));`}
